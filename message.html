
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>A Little Something for Lily 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px 50px;
      background: linear-gradient(145deg, #fff7f0, #ffe5ee, #fff0f5);
      color: #713b53;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      color: #c15b83;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(34px, 8vw, 48px);
      font-weight: normal;
      margin: 18px 0;
    }

    .intro {
      color: #8b6274;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 26px;
    }

    .video-card {
      padding: 10px;
      background: #fffdf9;
      border-radius: 20px;
      box-shadow: 0 12px 35px #8d47651c;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #f5dce5;
      border-radius: 13px;
    }

    .caption {
      color: #b05279;
      font-style: italic;
      line-height: 1.7;
      margin: 20px 0;
    }

    .footer {
      margin-top: 35px;
      color: #a7798d;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">

    <p class="eyebrow">Happy Birthday Note✉️From Ayon and Neel</p>

    <h1>Happieee Happieee Birthday, Lily🌷</h1>

    <p class="intro">
     There is something More to come💌
    </p>

    <div class="video-card">
      <video controls playsinline preload="auto">
        <source src="birthdayvideo.mp4" type="video/mp4">
        Your browser does not support this video.
      </video>
    </div>

    <p class="caption">
      Warm wish from us. 💗
    </p>

    <p class="footer">Made with care, especially for Lily ♡</p>

  </main>
</body>
</html>
